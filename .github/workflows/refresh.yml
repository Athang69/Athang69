name: Refresh banner stats

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - scripts/gen_hero.py
      - assets/fonts/**
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh-banner
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate hero SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_hero.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "stats unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh banner stats"
          git push
